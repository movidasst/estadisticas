            Phone: (p) => <Icon d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" {...p} />,
            HelpCircle: (p) => <Icon d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z" {...p}><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" /></Icon>
        };

        const safeCalc = (num, den, factor = 1) => {
            const n = parseFloat(num) || 0;
            const d = parseFloat(den) || 0;
            if (d === 0) return "0.00";
            return ((n * factor) / d).toFixed(2);
        };

        // --- UTILIDADES ---
        const triggerDownload = (canvas, filename) => {
            const link = document.createElement('a');
            link.download = `${filename}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        const downloadElementAsPng = async (elementId, filename) => {
            const element = document.getElementById(elementId);
            if (!element) return;
            try {
                const canvas = await html2canvas(element, { 
                    scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, ignoreElements: (el) => el.classList.contains('no-print') 
                });
                triggerDownload(canvas, filename);
            } catch (err) { console.error("Error PNG:", err); alert("Error al exportar imagen."); }
        };

        // --- PERSISTENCIA LOCAL TEMPORAL ---
        // Se sustituirá por Supabase en la etapa de acceso y base de datos.
        const STORAGE_KEYS = {
            records: 'movidaSST.ntf474.records.v3',
            departments: 'movidaSST.ntf474.departments.v3',
            branches: 'movidaSST.ntf474.branches.v3',
            kValue: 'movidaSST.ntf474.kValue.v3'
        };
        const readStorage = (key, fallback) => {
            try {
                const raw = localStorage.getItem(key);
                return raw === null ? fallback : JSON.parse(raw);
            } catch (error) {
                console.warn('No se pudo leer almacenamiento local:', key, error);
                return fallback;
            }
        };
        const writeStorage = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); }
            catch (error) { console.warn('No se pudo guardar almacenamiento local:', key, error); }
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [accessUser, setAccessUser] = useState(() => {
                try {
                    const raw = sessionStorage.getItem(ACCESS_SESSION_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (error) {
                    return null;
                }
            });
            const [loginCedula, setLoginCedula] = useState('');
            const [loginCodigo, setLoginCodigo] = useState('');
            const [loginLoading, setLoginLoading] = useState(false);
            const [loginError, setLoginError] = useState('');
            const [records, setRecords] = useState(() => readStorage(STORAGE_KEYS.records, []));
            const [departments, setDepartments] = useState(() => readStorage(STORAGE_KEYS.departments, INITIAL_DEPARTMENTS));
            const [branches, setBranches] = useState(() => readStorage(STORAGE_KEYS.branches, INITIAL_BRANCHES));
            const [kValue, setKValue] = useState(() => {
                const stored = Number(readStorage(STORAGE_KEYS.kValue, DEFAULT_K));
                return K_OPTIONS.some(option => option.value === stored) ? stored : DEFAULT_K;
            });
            const [view, setView] = useState('dashboard');
            const [formData, setFormData] = useState({...INITIAL_FORM, department: 'Producción', branchId: 'b1'});
            const [editingId, setEditingId] = useState(null);
            
            const [filterDept, setFilterDept] = useState('Todos');
            const [filterBranch, setFilterBranch] = useState('Todos');
            const [filterYear, setFilterYear] = useState(new Date().getFullYear());
            const [filterType, setFilterType] = useState('Trabajo');
            const [notification, setNotification] = useState(null);
            const [billboardMode, setBillboardMode] = useState(false);
            const [isExporting, setIsExporting] = useState(false);
            const [showResetModal, setShowResetModal] = useState(false); 
            const [showHelpModal, setShowHelpModal] = useState(false); 
            const [showDemoModal, setShowDemoModal] = useState(false); 

            const [newDeptName, setNewDeptName] = useState('');
            const [newBranchName, setNewBranchName] = useState('');
            const [newBranchState, setNewBranchState] = useState(VENEZUELA_STATES[9]);

            useEffect(() => {
                if (departments.length > 0 && (!formData.department || !departments.includes(formData.department))) {
                    setFormData(prev => ({ ...prev, department: departments[0] }));
                }
                if (branches.length > 0 && (!formData.branchId || !branches.find(b => b.id === formData.branchId))) {
                    setFormData(prev => ({ ...prev, branchId: branches[0].id }));
                }
            }, [departments, branches]);

            useEffect(() => {
                if (notification) {
                    const timer = setTimeout(() => setNotification(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [notification]);

            // Persistencia provisional mientras no esté conectado Supabase.
            useEffect(() => writeStorage(STORAGE_KEYS.records, records), [records]);
            useEffect(() => writeStorage(STORAGE_KEYS.departments, departments), [departments]);
            useEffect(() => writeStorage(STORAGE_KEYS.branches, branches), [branches]);
            useEffect(() => writeStorage(STORAGE_KEYS.kValue, kValue), [kValue]);

            const handleLogin = async (event) => {
                event.preventDefault();
                setLoginError('');

                const cedula = String(loginCedula || '').replace(/\D/g, '');
                const codigo = String(loginCodigo || '').trim().toUpperCase();

                if (!/^[0-9]{5,12}$/.test(cedula)) {
                    setLoginError('Ingrese una cédula válida.');
                    return;
                }
                if (!/^[A-Z0-9]{5}$/.test(codigo)) {
                    setLoginError('El código de integrante debe tener exactamente 5 letras o números.');
                    return;
                }
                if (!supabaseClient) {
                    setLoginError('No se pudo iniciar la conexión con Supabase. Verifique su conexión a internet e intente de nuevo.');
                    return;
                }

                setLoginLoading(true);
                try {
                    const { data, error } = await supabaseClient.rpc('acceso_integrante', {
                        p_cedula: cedula,
                        p_codigo: codigo
                    });
                    if (error) throw error;

                    let row = null;
                    if (Array.isArray(data) && data.length === 1) {
                        row = data[0];
                    } else if (data && data.ok === true && data.member) {
                        row = data.member;
                    }

                    if (!row) {
                        setLoginError('Cédula o código de registro incorrectos. Verifique los datos e intente nuevamente.');
                        return;
                    }

                    const safeUser = {
                        cedula,
                        nombres: String(row.nombres || '').trim(),
                        apellidos: String(row.apellidos || '').trim()
                    };
                    sessionStorage.setItem(ACCESS_SESSION_KEY, JSON.stringify(safeUser));
                    setAccessUser(safeUser);
                    setLoginCodigo('');
                } catch (error) {
                    console.error('Error validando acceso:', error);
                    setLoginError('No fue posible validar el acceso en este momento. Intente nuevamente.');
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleLogout = () => {
                try { sessionStorage.removeItem(ACCESS_SESSION_KEY); } catch (error) {}
                setAccessUser(null);
                setLoginCedula('');
                setLoginCodigo('');
                setLoginError('');
            };

            // CÁLCULOS DE INDICADORES
            // Base seleccionable: OIT K = 1.000.000 u OSHA K = 200.000.
            // Trabajo usa HHE. In itinere usa HHT. El modo combinado suma
            // Trabajo + In itinere y usa HHE + HHT.
            const filteredRecords = useMemo(() => {
                return records.filter(r => {
                    const matchDept = filterDept === 'Todos' || r.department === filterDept;
                    const matchBranch = filterBranch === 'Todos' || r.branchId === filterBranch;
                    const matchYear = Number(r.year) === Number(filterYear);
                    return matchDept && matchBranch && matchYear;
                });
            }, [records, filterDept, filterBranch, filterYear]);

            const metricParts = (r, mode = filterType) => {
                const work = {
                    accidents: Number(r.work_accidents || 0),
                    nlt: Number(r.work_acc || 0),
                    nlpt: Number(r.work_lostTimeAcc || 0),
                    days: Number(r.work_daysLost || 0) + Number(r.work_daysCharged || 0),
                    denominator: Number(r.hours || 0)
                };
                const itinere = {
                    accidents: Number(r.itinere_accidents || 0),
                    nlt: Number(r.itinere_acc || 0),
                    nlpt: Number(r.itinere_lostTimeAcc || 0),
                    days: Number(r.itinere_daysLost || 0) + Number(r.itinere_daysCharged || 0),
                    denominator: Number(r.travel_hours || 0)
                };
                if (mode === 'Itinere') return itinere;
                if (mode === 'Combinado') {
                    return {
                        accidents: work.accidents + itinere.accidents,
                        nlt: work.nlt + itinere.nlt,
                        nlpt: work.nlpt + itinere.nlpt,
                        days: work.days + itinere.days,
                        denominator: work.denominator + itinere.denominator
                    };
                }
                return work;
            };

            const monthlyStats = useMemo(() => {
                return MONTHS.map(month => {
                    const monthRecs = filteredRecords.filter(r => r.month === month);
                    const hhe = monthRecs.reduce((s, r) => s + Number(r.hours || 0), 0);
                    const hht = monthRecs.reduce((s, r) => s + Number(r.travel_hours || 0), 0);
                    const workers = monthRecs.reduce((s, r) => s + Number(r.workers || 0), 0);

                    const selected = monthRecs.reduce((acc, r) => {
                        const part = metricParts(r, filterType);
                        acc.accidents += part.accidents;
                        acc.nlt += part.nlt;
                        acc.nlpt += part.nlpt;
                        acc.days += part.days;
                        acc.denominator += part.denominator;
                        return acc;
                    }, { accidents: 0, nlt: 0, nlpt: 0, days: 0, denominator: 0 });

                    const workTotal = monthRecs.reduce((s,r) => s + Number(r.work_acc || 0), 0);
                    const itiTotal = monthRecs.reduce((s,r) => s + Number(r.itinere_acc || 0), 0);
                    const missionTotal = monthRecs.reduce((s,r) => s + Number(r.mission_acc || 0), 0);
                    const recreationTotal = monthRecs.reduce((s,r) => s + Number(r.recreation_acc || 0), 0);

                    return {
                        month,
                        hhe,
                        hht,
                        hours: selected.denominator,
                        workers,
                        ifn: safeCalc(selected.nlpt, selected.denominator, kValue),
                        ifb: safeCalc(selected.nlt, selected.denominator, kValue),
                        is: safeCalc(selected.days, selected.denominator, kValue),
                        ia: workers > 0 ? ((selected.accidents * 100) / workers).toFixed(2) : '0.00',
                        accidentCount: selected.accidents,
                        dynamicCount: selected.nlt,
                        lostTimeCount: selected.nlpt,
                        dynamicDays: selected.days,
                        totalWorkAcc: workTotal,
                        itinere_acc: itiTotal,
                        mission_acc: missionTotal,
                        recreation_acc: recreationTotal
                    };
                });
            }, [filteredRecords, filterType, kValue]);

            const globalStats = useMemo(() => {
                const totalDenominator = monthlyStats.reduce((s, d) => s + d.hours, 0);
                const totalHHE = monthlyStats.reduce((s, d) => s + d.hhe, 0);
                const totalHHT = monthlyStats.reduce((s, d) => s + d.hht, 0);
                const totalAccidents = monthlyStats.reduce((s, d) => s + d.accidentCount, 0);
                const totalEvents = monthlyStats.reduce((s, d) => s + d.dynamicCount, 0);
                const totalLostTimeEvents = monthlyStats.reduce((s, d) => s + d.lostTimeCount, 0);
                const totalDays = monthlyStats.reduce((s, d) => s + d.dynamicDays, 0);

                const activeMonths = monthlyStats.filter(d => d.workers > 0);
                const avgWorkers = activeMonths.length
                    ? activeMonths.reduce((s, d) => s + d.workers, 0) / activeMonths.length
                    : 0;

                return {
                    hours: totalDenominator,
                    hhe: totalHHE,
                    hht: totalHHT,
                    workersAverage: avgWorkers,
                    ifn: safeCalc(totalLostTimeEvents, totalDenominator, kValue),
                    ifb: safeCalc(totalEvents, totalDenominator, kValue),
                    is: safeCalc(totalDays, totalDenominator, kValue),
                    ia: avgWorkers > 0 ? ((totalAccidents * 100) / avgWorkers).toFixed(2) : '0.00',
                    accidentCountTotal: totalAccidents,
                    dynamicCountTotal: totalEvents,
                    totalWorkAcc: filteredRecords.reduce((s,r) => s + Number(r.work_acc || 0), 0),
                    itinere: filteredRecords.reduce((s,r) => s + Number(r.itinere_acc || 0), 0),
                    mission: filteredRecords.reduce((s,r) => s + Number(r.mission_acc || 0), 0),
                    rec: filteredRecords.reduce((s,r) => s + Number(r.recreation_acc || 0), 0)
                };
            }, [monthlyStats, filteredRecords, kValue]);

            // --- EXPORTAR A EXCEL (Traducción + Plantilla) ---
            const exportData = () => {
                // Validación de librería
                if (typeof XLSX === 'undefined') {
                    alert("Error: La librería de Excel no se ha cargado correctamente. Verifique su conexión a internet.");
                    return;
                }

                try {
                    let ws;
                    let fileName;
                    const dataToExport = records.map(record => {
                        const translatedRecord = {};
                        Object.keys(record).forEach(key => {
                            const label = FIELD_LABELS[key] || key; 
                            translatedRecord[label] = record[key];
                        });
                        return translatedRecord;
                    });

                    if (dataToExport.length === 0) {
                        const headers = Object.values(FIELD_LABELS);
                        ws = XLSX.utils.aoa_to_sheet([headers]); 
                        fileName = `SST_Plantilla_Carga_${new Date().toISOString().slice(0,10)}.xlsx`;
                        setNotification("Plantilla vacía descargada.");
                    } else {
                        ws = XLSX.utils.json_to_sheet(dataToExport);
                        fileName = `SST_Backup_${new Date().toISOString().slice(0,10)}.xlsx`;
                        setNotification("Excel exportado correctamente.");
                    }

                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "Registros");
                    XLSX.writeFile(wb, fileName);
                } catch (error) {
                    console.error("Error exportando Excel:", error);
                    alert("Hubo un error al generar el archivo Excel.");
                }
            };

            // --- IMPORTAR DESDE EXCEL (Traducción Inversa) ---
            const importData = (e) => {
                if (typeof XLSX === 'undefined') {
                    alert("Error: La librería de Excel no se ha cargado correctamente.");
                    return;
                }
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = new Uint8Array(ev.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        let rawRecords = XLSX.utils.sheet_to_json(worksheet);

                        if (rawRecords.length > 0) {
                            let legacyDetected = false;
                            const importedRecords = rawRecords.map((r, idx) => {
                                const internalRecord = {};
                                Object.keys(r).forEach(label => {
                                    const key = LABELS_TO_FIELDS[label] || LEGACY_LABELS_TO_FIELDS[label] || label;
                                    if (LEGACY_LABELS_TO_FIELDS[label]) legacyDetected = true;
                                    internalRecord[key] = r[label];
                                });

                                // Los respaldos anteriores no separaban NLT de NLPT ni registraban HHT.
                                // No se inventan esos datos: se inicializan en cero para que el usuario los revise.
                                return {
                                    ...INITIAL_FORM,
                                    ...internalRecord,
                                    travel_hours: internalRecord.travel_hours ?? 0,
                                    work_accidents: internalRecord.work_accidents ?? internalRecord.work_acc ?? 0,
                                    work_acc: internalRecord.work_acc ?? internalRecord.work_accidents ?? 0,
                                    itinere_accidents: internalRecord.itinere_accidents ?? internalRecord.itinere_acc ?? 0,
                                    itinere_acc: internalRecord.itinere_acc ?? internalRecord.itinere_accidents ?? 0,
                                    work_lostTimeAcc: internalRecord.work_lostTimeAcc ?? 0,
                                    itinere_lostTimeAcc: internalRecord.itinere_lostTimeAcc ?? 0,
                                    mission_lostTimeAcc: internalRecord.mission_lostTimeAcc ?? 0,
                                    recreation_lostTimeAcc: internalRecord.recreation_lostTimeAcc ?? 0,
                                    id: internalRecord.id || (Date.now() + idx).toString()
                                };
                            });

                            setRecords(importedRecords);
                            const importedDepts = [...new Set(importedRecords.map(r => r.department))].filter(Boolean);
                            if (importedDepts.length > 0) setDepartments(prev => [...new Set([...prev, ...importedDepts])]);
                            setNotification(legacyDetected ? "Importado. Revise NLPT y HHT antes de usar los índices." : "Datos Excel importados correctamente.");
                            if (legacyDetected) {
                                alert("El archivo pertenece a una versión anterior. Se importaron los eventos antiguos como número de accidentes y, provisionalmente, como NLT; revise esa equivalencia. Además, NLPT (lesiones con tiempo perdido) y HHT no existían en ese formato. Revise y complete esos campos antes de interpretar IFN/IS de forma oficial.");
                            }
                            if(importedRecords[0].year) setFilterYear(Number(importedRecords[0].year));
                            e.target.value = '';
                        } else {
                            alert("El archivo Excel parece estar vacío.");
                        }
                    } catch (err) { console.error(err); alert("Error al leer el archivo Excel. Verifique el formato."); }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleDownloadPDF = async () => {
                setIsExporting(true);
                if(view !== 'dashboard') { setView('dashboard'); await new Promise(r => setTimeout(r, 100)); }
                const element = document.getElementById('app-container');
                if (!element) { setIsExporting(false); return; }
                const originalScrollPos = window.scrollY;
                window.scrollTo(0, 0);

                try {
                    const cloneContainer = document.createElement('div');
                    cloneContainer.style.cssText = 'position:absolute;top:0;left:0;width:100%;z-index:10000;background:#ffffff;pointer-events:none;';
                    document.body.appendChild(cloneContainer);

                    const clonedNode = element.cloneNode(true);
                    clonedNode.style.cssText = 'height:auto;overflow:visible;max-height:none;';
                    
                    clonedNode.querySelectorAll('.no-print').forEach(btn => btn.style.display = 'none');
                    element.querySelectorAll('svg').forEach((orig, idx) => {
                        const clone = clonedNode.querySelectorAll('svg')[idx];
                        if (clone) {
                            const rect = orig.getBoundingClientRect();
                            clone.setAttribute('width', rect.width);
                            clone.setAttribute('height', rect.height);
                            clone.style.width = `${rect.width}px`;
                            clone.style.height = `${rect.height}px`;
                            clone.style.display = 'block';
                        }
                    });

                    cloneContainer.appendChild(clonedNode);
                    await new Promise(r => setTimeout(r, 100));
                    const canvas = await html2canvas(clonedNode, { scale: 2, useCORS: true, backgroundColor: '#ffffff', logging: false });
                    document.body.removeChild(cloneContainer);
                    window.scrollTo(0, originalScrollPos);

                    const imgData = canvas.toDataURL('image/png');
                    const pdf = new jsPDF('p', 'mm', 'a4');
                    const pdfWidth = 210; const pdfHeight = 297; const margin = 10;
                    const contentWidth = pdfWidth - (2 * margin);
                    const contentHeight = (canvas.height * contentWidth) / canvas.width;
                    
                    if (contentHeight > (pdfHeight - 20)) {
                        const ratio = (pdfHeight - 20) / contentHeight;
                        const scaledWidth = contentWidth * ratio;
                        const xOffset = margin + (contentWidth - scaledWidth) / 2;
                        pdf.addImage(imgData, 'PNG', xOffset, margin, scaledWidth, (pdfHeight - 20));
                    } else {
                        pdf.addImage(imgData, 'PNG', margin, margin, contentWidth, contentHeight);
                    }

                    pdf.addPage();
                    pdf.setFontSize(14);
                    const activeKOption = K_OPTIONS.find(option => option.value === kValue) || K_OPTIONS[0];
                    pdf.text(`Año ${filterYear} · NVC 474:1997 · NTF 474:2014 · ${activeKOption.label} K=${kValue.toLocaleString('es-VE')} · ${filterType}`, margin, 20);
                    
                    const denominatorLabelPDF = filterType === 'Trabajo' ? 'HHE' : (filterType === 'Itinere' ? 'HHT' : 'HHE+HHT');
                    const columns = ["Mes", denominatorLabelPDF, "IFN", "IFB", "IS", "Acc.", "IA %", "Trabajo", "Itinere", "Misión", "Recr."];
                    const rows = monthlyStats.map(r => [r.month, Number(r.hours).toLocaleString(), r.ifn, r.ifb, r.is, r.accidentCount, r.ia, r.totalWorkAcc, r.itinere_acc, r.mission_acc, r.recreation_acc]);
                    rows.push(["TOTAL", globalStats.hours.toLocaleString(), globalStats.ifn, globalStats.ifb, globalStats.is, globalStats.accidentCountTotal, `${globalStats.ia}*`, globalStats.totalWorkAcc, globalStats.itinere, globalStats.mission, globalStats.rec]);

                    pdf.autoTable({
                        head: [columns], body: rows, startY: 30, theme: 'grid',
                        headStyles: { fillColor: [11, 42, 111], textColor: 255, fontStyle: 'bold' },
                        footStyles: { fillColor: [51, 65, 85], textColor: 255, fontStyle: 'bold' },
                        styles: { fontSize: 9, cellPadding: 3 },
                        didParseRow: function(data) { if (data.row.index === rows.length - 1) { data.row.styles.fontStyle = 'bold'; data.row.styles.fillColor = [220, 220, 220]; } }
                    });

                    const totalPages = pdf.internal.getNumberOfPages();
                    for (let i = 1; i <= totalPages; i++) {
                        pdf.setPage(i);
                        pdf.setFontSize(8);
                        pdf.setTextColor(150);
                        const str = `Página ${i} de ${totalPages} - ${activeKOption.label} K=${kValue.toLocaleString('es-VE')} - www.movidasst.com`;
                        pdf.text(str, margin, pdfHeight - 10);
                    }

                    pdf.save(`MovidaSST_NTF474_${filterType}_${filterYear}.pdf`);
                    setNotification("Reporte Completo Generado");
                } catch (err) { console.error("Error PDF:", err); alert("Error al generar PDF."); if(document.querySelector('div[style*="z-index: 10000"]')) document.body.removeChild(document.querySelector('div[style*="z-index: 10000"]')); } finally { setIsExporting(false); }
            };

            const confirmReset = () => {
                setRecords([]); setDepartments(INITIAL_DEPARTMENTS); setBranches(INITIAL_BRANCHES); setKValue(DEFAULT_K);
                setFilterDept('Todos'); setFilterBranch('Todos'); setFilterType('Trabajo'); setFilterYear(new Date().getFullYear());
                setFormData({...INITIAL_FORM, department: INITIAL_DEPARTMENTS[0], branchId: INITIAL_BRANCHES[0].id});
                setShowResetModal(false); setNotification("Sistema reiniciado correctamente."); setView('dashboard');
            };

            const handleReset = () => setShowResetModal(true);
            const handlePrint = () => { setTimeout(() => window.print(), 500); };
            
            const confirmLoadDemo = () => {
                setEditingId(null); setRecords([]);
                setDepartments(['Producción', 'Ventas', 'Admin', 'Logística']);
                setBranches([{id: 'b1', name: 'Caracas'}, {id: 'b2', name: 'Valencia'}]);
                const recs = []; const rand = (a, b) => Math.floor(Math.random()*(b-a+1))+a;

                        <div className="text-center pb-5 sm:pb-7 mb-4">
                            <img src={OFFICIAL_LOGO} alt="La Movida de SST" className="mx-auto w-24 sm:w-28 h-auto object-contain mb-3" referrerPolicy="no-referrer" />
                            <p className="text-[11px] sm:text-xs font-extrabold uppercase tracking-[.16em]" style={{color: ACCENT_COLOR}}>De la Reacción a la Prevención</p>
                            <h1 className="text-xl sm:text-3xl font-black tracking-tight text-slate-900 mt-1">Estadísticas de lesiones de trabajo</h1>
                            <h2 className="text-sm sm:text-lg font-bold mt-1" style={{color: BRAND_COLOR}}>NVC 474:1997 · NTF 474:2014 · {(K_OPTIONS.find(o => o.value === kValue) || K_OPTIONS[0]).label} K = {kValue.toLocaleString('es-VE')}</h2>
                            <div className="mt-4 text-[11px] sm:text-xs text-slate-500 flex flex-wrap justify-center items-center gap-x-4 gap-y-1 border-t border-slate-200 pt-4 mx-auto max-w-4xl">
                               <span><Icons.User className="inline h-3 w-3 mr-1"/>Elaborado por: David Linares Brea</span>
                               <span><Icons.Globe className="inline h-3 w-3 mr-1"/>www.movidasst.com</span>
                            </div>
                        </div>
                        {!billboardMode && (
                            <div className="storage-warning no-print max-w-5xl mx-auto mb-5 rounded-2xl p-4 sm:p-5">
                                <div className="flex items-start gap-3">
                                    <Icons.AlertCircle className="h-5 w-5 flex-shrink-0 mt-0.5"/>
                                    <div className="min-w-0 flex-1">
                                        <h3 className="font-black text-sm">Importante: los datos se guardan solamente en este navegador</h3>
                                        <p className="text-xs sm:text-sm mt-1 leading-relaxed">
                                            Los registros, sucursales, departamentos y la configuración se almacenan localmente en este dispositivo; <strong>no se guardan todavía en Supabase</strong>. Cerrar la pestaña o el navegador normalmente no los elimina, pero pueden perderse si borra los datos del sitio o del navegador, usa navegación privada, cambia de navegador o dispositivo, reinstala el navegador o se limpia el almacenamiento local.
                                        </p>
                                        <div className="mt-3 flex flex-col sm:flex-row sm:items-center gap-2">
                                            <button type="button" onClick={exportData} className="header-btn bg-white border border-amber-300 text-amber-900"><Icons.Save className="h-4 w-4"/> Descargar respaldo Excel</button>
                                            <span className="text-[11px] sm:text-xs font-semibold">Recomendación: descargue un respaldo al finalizar cada sesión de trabajo.</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        {content}
                    </main>
                </div>
            );
        }

        const SettingsOrInputView = ({ view, departments, branches, addBranch, newBranchName, setNewBranchName, newBranchState, setNewBranchState, removeBranch, addDept, newDeptName, setNewDeptName, removeDept, kValue, setKValue }) => {
            if (view !== 'settings') return null;
            return (
                <div className="max-w-5xl mx-auto animate-in fade-in space-y-5 no-print">
                    <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
                        <div className="flex items-start gap-3">
                            <div className="p-2 rounded-xl bg-sky-50" style={{color: ACCENT_COLOR}}><Icons.Calculator className="h-5 w-5"/></div>
                            <div className="flex-1">
                                <h2 className="font-black text-slate-900">Configuración técnica</h2>
                                <p className="text-sm text-slate-500 mt-1">Seleccione la base con la que desea expresar los índices. La aplicación usa <strong>OIT K = 1.000.000</strong> por defecto y permite cambiar a <strong>OSHA K = 200.000</strong>.</p>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4">
                                    {K_OPTIONS.map(option => (
                                        <button key={option.value} type="button" onClick={() => setKValue(option.value)} className={`text-left rounded-xl border p-3 transition ${kValue === option.value ? 'border-sky-500 bg-sky-50 ring-2 ring-sky-100' : 'border-slate-200 bg-white hover:bg-slate-50'}`}>
                                            <div className="flex items-center justify-between gap-3"><strong className="text-sm text-slate-800">{option.label}</strong>{kValue === option.value && <span className="text-[10px] font-black uppercase text-sky-700">Activo</span>}</div>
                                            <div className="text-lg font-black mt-1" style={{color: BRAND_COLOR}}>K = {option.value.toLocaleString('es-VE')}</div>
                                            <div className="text-xs text-slate-500 mt-1">{option.description}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </section>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
                            <h3 className="font-extrabold mb-4 text-slate-800">Sucursales</h3>
                            <form onSubmit={addBranch} className="grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2 mb-4">
                                <input value={newBranchName} onChange={e=>setNewBranchName(e.target.value)} className="input-field" placeholder="Nombre de sucursal" required />
                                <select value={newBranchState} onChange={e=>setNewBranchState(e.target.value)} className="input-field">{VENEZUELA_STATES.map(state=><option key={state} value={state}>{state}</option>)}</select>
                                <button className="btn-primary-action header-btn px-4" aria-label="Agregar sucursal"><Icons.Plus className="h-4 w-4"/><span className="sm:hidden">Agregar</span></button>
                            </form>
                            <div className="max-h-64 overflow-y-auto space-y-2">
                                {branches.map(branch=><div key={branch.id} className="flex items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm"><span className="min-w-0"><strong className="block truncate">{branch.name}</strong><span className="text-xs text-slate-500">{branch.state}</span></span><button onClick={()=>removeBranch(branch.id)} className="header-btn btn-danger-action px-2" aria-label={`Eliminar ${branch.name}`}><Icons.Trash2 className="h-4 w-4"/></button></div>)}
                            </div>
                        </section>

                        <section className="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-5">
                            <h3 className="font-extrabold mb-4 text-slate-800">Departamentos</h3>
                            <form onSubmit={addDept} className="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-2 mb-4">
                                <input value={newDeptName} onChange={e=>setNewDeptName(e.target.value)} className="input-field" placeholder="Nombre del departamento" required />
                                <button className="btn-primary-action header-btn px-4"><Icons.Plus className="h-4 w-4"/> Agregar</button>
                            </form>
                            <div className="max-h-64 overflow-y-auto space-y-2">
                                {departments.map(dept=><div key={dept} className="flex items-center justify-between gap-3 p-3 bg-slate-50 rounded-xl border border-slate-100 text-sm"><span className="font-semibold truncate">{dept}</span><button onClick={()=>removeDept(dept)} className="header-btn btn-danger-action px-2" aria-label={`Eliminar ${dept}`}><Icons.Trash2 className="h-4 w-4"/></button></div>)}
                            </div>
                        </section>
                    </div>
                </div>
            );
        };

        const MetricInputCard = ({ icon: CardIcon, title, tone = 'neutral', supplemental = false, accidentName, accName, lostTimeName, daysLostName, daysChargedName, formData, onChange }) => {
            const tones = {
                work: 'border-blue-200 bg-blue-50/40',
                itinere: 'border-cyan-200 bg-cyan-50/40',
                neutral: 'border-slate-200 bg-white'
            };
            const titleTone = tone === 'work' ? 'text-blue-900' : tone === 'itinere' ? 'text-cyan-900' : 'text-slate-700';
            return (
                <section className={`rounded-2xl border p-4 ${tones[tone] || tones.neutral}`}>
                    <div className={`flex items-center gap-2 mb-3 font-extrabold text-sm ${titleTone}`}><CardIcon className="h-4 w-4"/>{title}</div>
                    <div className="grid grid-cols-2 gap-3">
                        {accidentName && <div className="col-span-2"><label className="label-text">N.º accidentes · para IA</label><input type="number" min="0" step="1" name={accidentName} value={formData[accidentName]} onChange={onChange} className="input-field" inputMode="numeric"/></div>}
                        <div><label className="label-text">{supplemental ? 'Eventos registrados' : 'NLT · lesiones totales'}</label><input type="number" min="0" step="1" name={accName} value={formData[accName]} onChange={onChange} className="input-field" inputMode="numeric"/></div>
                        <div><label className="label-text">{supplemental ? 'Con tiempo perdido' : 'NLPT · con tiempo perdido'}</label><input type="number" min="0" step="1" name={lostTimeName} value={formData[lostTimeName]} onChange={onChange} className="input-field" inputMode="numeric"/></div>
                        <div><label className="label-text">{supplemental ? 'Días perdidos' : 'TDP · días perdidos'}</label><input type="number" min="0" step="1" name={daysLostName} value={formData[daysLostName]} onChange={onChange} className="input-field" inputMode="numeric"/></div>
                        <div><label className="label-text">{supplemental ? 'Días cargados' : 'Días cargados adicionales'}</label><input type="number" min="0" step="1" name={daysChargedName} value={formData[daysChargedName]} onChange={onChange} className="input-field" inputMode="numeric"/></div>
                    </div>
                </section>
            );
        };

        const SimpleLineChart = ({ data, dataKey1, dataKey2, color1, color2 }) => { 
           if(!data.length) return null; 
           const width = 1200; const height = 400; const padding = 40;
           const vals = data.flatMap(d => [Number(d[dataKey1])||0, Number(d[dataKey2])||0]); 
           const max = Math.max(...vals, 1) * 1.2;
           const getPoints = k => data.map((d, i) => { const x = padding + (i / (data.length - 1 || 1)) * (width - 2 * padding); const val = Number(d[k]) || 0; const y = (height - padding) - (val / max) * (height - 2 * padding); return {x, y, val: Number(d[k])||0}; });
           const l1 = getPoints(dataKey1); const l2 = getPoints(dataKey2);
           const path1 = l1.map(pt => `${pt.x},${pt.y}`).join(' '); const path2 = l2.map(pt => `${pt.x},${pt.y}`).join(' ');
           return (<svg id="chart-line-svg" viewBox={`0 0 ${width} ${height}`} className="w-full h-full" width="100%" height="100%"><rect width={width} height={height} fill="white" />{[0,0.25,0.5,0.75,1].map(k=><line key={k} x1={padding} y1={height-(height*k)-padding} x2={width-padding} y2={height-(height*k)-padding} stroke="#f1f5f9" strokeWidth="2"/>)}<polyline points={path1} fill="none" stroke={color1} strokeWidth="5" strokeLinecap="round"/><polyline points={path2} fill="none" stroke={color2} strokeWidth="3" strokeDasharray="15,10"/>{l1.map((pt,i)=><g key={i}><circle cx={pt.x} cy={pt.y} r="8" fill="white" stroke={color1} strokeWidth="4"/><rect x={pt.x-20} y={pt.y-45} width="40" height="25" rx="5" fill="white" fillOpacity="0.8"/><text x={pt.x} y={pt.y-25} fontSize="22" fontWeight="bold" fill={color1} textAnchor="middle">{pt.val>0?pt.val:''}</text></g>)}{data.map((d,i)=>{const x = padding + (i/(data.length-1||1))*(width-2*padding); return <text key={i} x={x} y={height - 10} fontSize="16" fill="#64748b" textAnchor="middle">{d.month.substring(0,3).toUpperCase()}</text>})}</svg>);
        };

        const SimpleBarChart = ({ data, dataKey, color }) => { 
           if(!data.length) return null; 
           const width = 1200; const height = 400; const padding = 40;
           const vals = data.map(d=>Number(d[dataKey])||0); const max=Math.max(...vals,1)*1.2;
           return (<svg id="chart-bar-svg" viewBox={`0 0 ${width} ${height}`} className="w-full h-full" width="100%" height="100%"><rect width={width} height={height} fill="white" />{[0,0.5,1].map(k=><line key={k} x1={padding} y1={height-padding-(height-2*padding)*k} x2={width-padding} y2={height-padding-(height-2*padding)*k} stroke="#f1f5f9" strokeWidth="2"/>)}{data.map((d,i)=>{ const val = Number(d[dataKey])||0; const bh = (val/max)*(height-2*padding); const bw = ((width-2*padding)/data.length)*0.6; const x = padding + (i * ((width-2*padding)/data.length)) + (((width-2*padding)/data.length)-bw)/2; const y = height - padding - bh; let fill = val>500 ? '#ef4444' : (val>100 ? '#f59e0b' : '#22c55e'); return <g key={i}><rect x={x} y={y} width={bw} height={bh} fill={fill} rx="4"/>{val>0 && <text x={x+bw/2} y={y-10} fontSize="20" fontWeight="bold" fill="#334155" textAnchor="middle">{val}</text>}<text x={x+bw/2} y={height - 10} fontSize="16" fill="#64748b" textAnchor="middle">{d.month.substring(0,3).toUpperCase()}</text></g>})}</svg>);
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
